<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>42° Aniversario — Grupo Valle de Puebla · AA</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&amp;family=Lato:wght@400;700&amp;family=Poppins:wght@800;900&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" rel="preload"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&amp;family=Lato:wght@400;700&amp;family=Poppins:wght@800;900&amp;display=swap" rel="stylesheet"/></noscript>
<style>
  /* ── DISEÑO ARCHIVO HISTÓRICO ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f4f8;
    color: #1a2a3a;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    line-height: 1.7;
  }

  /* HERO */
  .hero {
    min-height: auto;
    background: linear-gradient(160deg, #dde8f0 0%, #e8f0f7 40%, #f0f4f8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(44,95,138,0.08) 0%, transparent 70%);
  }
  .hero-badge {
    display: inline-block;
    border: 1px solid #2c5f8a;
    color: #2c5f8a;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 8px 24px;
    margin-bottom: 30px;
    font-weight: 700;
  }
  .hero-number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(90px, 22vw, 180px);
    font-weight: 900;
    line-height: 0.85;
    color: transparent;
    -webkit-text-stroke: 2px #2c5f8a;
    letter-spacing: -4px;
    margin-bottom: 10px;
    animation: fadeUp 1.2s ease both;
  }
  .hero-aniv {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 42px);
    color: #2c5f8a;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: fadeUp 1.2s 0.2s ease both;
  }
  .hero-logo-img {
    width: clamp(180px, 40vw, 280px);
    height: clamp(180px, 40vw, 280px);
    border-radius: 50%;
    box-shadow: 0 8px 28px rgba(44,95,138,0.25);
    margin-bottom: 24px;
    animation: fadeUp 1.2s ease both;
  }
  .hero-grupo {
    font-weight: 700;
    font-size: clamp(18px, 4.5vw, 26px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(26,42,58,0.95);
    margin-bottom: 8px;
    animation: fadeUp 1.2s 0.4s ease both;
  }
  .hero-aa {
    font-size: clamp(13px, 3vw, 16px);
    color: #2c5f8a;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 40px;
    animation: fadeUp 1.2s 0.5s ease both;
  }
  .hero-dates {
    font-size: 15px;
    color: rgba(26,42,58,0.8);
    letter-spacing: 2px;
    border-top: 1px solid rgba(44,95,138,0.3);
    padding-top: 20px;
    margin-top: 10px;
    animation: fadeUp 1.2s 0.6s ease both;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SECCIONES */
  section { padding: 60px 20px; max-width: 700px; margin: 0 auto; }

  .section-label {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #2c5f8a;
    margin-bottom: 12px;
    font-weight: 700;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 700;
    color: #1a2a3a;
    margin-bottom: 24px;
    line-height: 1.2;
  }
  .divider { width: 60px; height: 2px; background: transparent; margin: 20px 0 30px; }
  p { color: rgba(26,42,58,0.8); font-size: 20px; margin-bottom: 16px; font-weight: 400; text-align: justify; }

  .section-dark { background: #e2ecf4; padding: 60px 20px; }
  .section-dark > div { max-width: 700px; margin: 0 auto; }
  .section-alt { background: linear-gradient(135deg, #dde8f2 0%, #e8f0f8 100%); padding: 60px 20px; border-top: 1px solid rgba(44,95,138,0.2); border-bottom: 1px solid rgba(44,95,138,0.2); }
  .section-alt > div { max-width: 700px; margin: 0 auto; }

  /* PLACEHOLDER */
  .placeholder {
    border: 2px dashed rgba(44,95,138,0.3);
    border-radius: 4px;
    padding: 24px;
    text-align: center;
    color: rgba(44,95,138,0.5);
    font-size: 13px;
    letter-spacing: 1px;
    margin: 16px 0;
    background: rgba(44,95,138,0.03);
  }
  .placeholder span { display: block; font-size: 22px; margin-bottom: 8px; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 30px 0; background: rgba(44,95,138,0.15); }
  .stat-box { background: #f0f4f8; padding: 24px 16px; text-align: center; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: clamp(32px, 8vw, 52px); color: #2c5f8a; line-height: 1; font-weight: 900; }
  .stat-label { font-size: 11px; color: rgba(26,42,58,0.4); text-transform: uppercase; letter-spacing: 2px; margin-top: 6px; display: block; }

  /* MESA */
  .mesa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  @media(max-width: 480px) { .mesa-grid { grid-template-columns: 1fr; } }
  .mesa-card { background: rgba(44,95,138,0.06); border: 1px solid rgba(44,95,138,0.2); border-radius: 2px; padding: 20px; }
  .mesa-card h3 { font-family: 'Playfair Display', serif; color: #2c5f8a; font-size: 18px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(44,95,138,0.2); }
  .mesa-item { display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px solid rgba(26,42,58,0.06); gap: 2px; }
  .mesa-role { font-size: 12px; color: rgba(26,42,58,0.75); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .mesa-name { font-size: 16px; color: #1a2a3a; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .mesa-name a { font-size: 15px; font-weight: 400; color: #2c5f8a; text-decoration: none; white-space: nowrap; margin-left: auto; }
  .mesa-pending { font-size: 12px; color: rgba(44,95,138,0.4); font-style: italic; text-align: right; }

  /* HORARIOS */
  .horarios-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
  @media(max-width: 400px) { .horarios-grid { grid-template-columns: 1fr; } }
  .horario-item { background: rgba(44,95,138,0.06); border-left: 3px solid #2c5f8a; padding: 12px 16px; }
  .horario-time { font-family: 'Playfair Display', serif; font-size: 22px; color: #2c5f8a; line-height: 1; }
  .horario-dias { font-size: 12px; color: rgba(26,42,58,0.5); margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; }

  /* AUTONOMIA */
  .autonomia-list { list-style: none; margin-top: 20px; }
  .autonomia-list li { padding: 14px 0 14px 28px; border-bottom: 1px solid rgba(44,95,138,0.1); color: rgba(26,42,58,0.85); font-size: 19px; font-weight: 400; position: relative; line-height: 1.5; }
  .autonomia-list li::before { content: '·'; color: #2c5f8a; position: absolute; left: 0; font-size: 28px; line-height: 1.2; }

  /* TESTIMONIOS */
  .testimonios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 24px; }
  @keyframes cardEntrada {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .testimonio-card { background: rgba(44,95,138,0.05); border: 1px solid rgba(44,95,138,0.15); border-radius: 2px; padding: 14px; text-align: center; opacity: 0; }
  .testimonio-card.visible { animation: cardEntrada 0.45s ease forwards; }
  .testimonio-num { font-family: 'Playfair Display', serif; font-size: 38px; color: #0f2340; line-height: 1; margin-bottom: 2px; } .testimonio-aniv { font-size: 10px; color: rgba(15,35,64,0.85); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; font-weight: 800; }
  .testimonio-name { font-size: 17px; color: #0a1628; font-weight: 800; margin-bottom: 4px; }
  .testimonio-date { font-size: 15px; color: rgba(26,42,58,0.6); }

  /* TIMELINE */
  .timeline { position: relative; padding-left: 30px; margin-top: 30px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, #2c5f8a, transparent); }
  .timeline-item { position: relative; margin-bottom: 28px; opacity: 0; transform: translateX(-10px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .timeline-item.visible { opacity: 1; transform: translateX(0); }
  .timeline-dot { position: absolute; left: -25px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #2c5f8a; border: 2px solid #f0f4f8; }
  .timeline-date { font-size: 14px; letter-spacing: 2px; color: #2c5f8a; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .timeline-text { font-size: 20px; color: rgba(26,42,58,0.85); font-weight: 400; margin: 0; }

  /* FOTOS */
  .fotos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
  .foto-placeholder { background: rgba(44,95,138,0.05); border: 2px dashed rgba(44,95,138,0.25); border-radius: 4px; aspect-ratio: 4/3; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(44,95,138,0.4); font-size: 12px; text-align: center; padding: 10px; }
  .foto-placeholder span { font-size: 28px; margin-bottom: 6px; }

  /* ACTIVIDADES */
  .actividad-item { background: rgba(44,95,138,0.04); border: 1px solid rgba(44,95,138,0.12); padding: 20px; margin-bottom: 14px; border-radius: 2px; }
  .actividad-item h4 { font-family: 'Playfair Display', serif; color: #2c5f8a; font-size: 17px; margin-bottom: 8px; }

  /* FOOTER */
  footer { background: #dde8f2; padding: 50px 20px; text-align: center; border-top: 1px solid rgba(44,95,138,0.2); }
  .footer-phrase { font-family: 'Playfair Display', serif; font-size: clamp(18px, 4vw, 26px); color: #2c5f8a; font-style: italic; margin-bottom: 16px; }
  .footer-sub { font-size: 13px; color: rgba(26,42,58,0.45); letter-spacing: 2px; text-transform: uppercase; }

  .timeline-num {
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(44,95,138,0.7);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .evento-foto {
    margin-top: 12px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(44,95,138,0.15);
    background: rgba(44,95,138,0.04);
    text-align: center;
  }
  .evento-foto img {
    width: 100%;
    max-width: 100%;
    height: auto;
    max-height: 520px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    cursor: zoom-in;
    transition: opacity 0.2s;
  }
  .evento-foto img:hover { opacity: 0.92; }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 4px;
    object-fit: contain;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #lightbox-close {
    position: fixed;
    top: 16px; right: 20px;
    color: #fff;
    font-size: 36px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.8;
    z-index: 100000;
  }
  #lightbox-close:hover { opacity: 1; }


  .est-vigente { background: rgba(39,174,96,0.15); color: #1e8449; font-size:11px; font-weight:700; padding:3px 10px; border-radius:50px; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; border:1px solid rgba(39,174,96,0.3); }
  .est-proximo {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 10px; border-radius: 50px;
    background: rgba(230,140,0,0.12); color: #b36b00;
    border: 1px solid rgba(230,140,0,0.3);
  }
  /* ── FILTROS ACUERDOS ── */
  #acuerdos-filtros {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 16px;
  }
  .acuerdo-filtro-btn {
    padding: 5px 12px; border-radius: 50px;
    border: 1px solid rgba(44,95,138,0.2);
    background: rgba(44,95,138,0.06);
    color: #2c5f8a; font-size: 11px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, color 0.15s;
    letter-spacing: 0.5px;
  }
  .acuerdo-filtro-btn.active { background: #2c5f8a; color: #fff; border-color: #2c5f8a; }
  .est-vencido { background: rgba(231,76,60,0.12); color: #c0392b; font-size:11px; font-weight:700; padding:3px 10px; border-radius:50px; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; border:1px solid rgba(231,76,60,0.3); }
  .acuerdo-card { background: rgba(44,95,138,0.04); border: 1px solid rgba(44,95,138,0.12); border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; }
  .acuerdo-num { font-family: 'Playfair Display', serif; font-size: 28px; color: #2c5f8a; font-weight: 900; line-height: 1; margin-bottom: 4px; }
  .acuerdo-titulo { font-size: 18px; font-weight: 700; color: #1a2a3a; margin-bottom: 8px; line-height: 1.4; }
  .acuerdo-desc { font-size: 16px; color: rgba(26,42,58,0.85); margin-bottom: 8px; line-height: 1.6; }
  .acuerdo-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .acuerdo-tag { font-size: 13px; background: rgba(44,95,138,0.08); color: #2c5f8a; padding: 4px 10px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px; }
  .acuerdo-propone { font-size: 14px; color: rgba(26,42,58,0.6); margin-top: 8px; }
  .acuerdo-mesa { font-size: 13px; color: rgba(26,42,58,0.5); margin-top: 3px; }
  body { padding-bottom: 80px; }

  .tab-radio { display: none; }
  .tab-content { display: none; }
  #radio-inicio:checked ~ #tab-inicio,
  #radio-mesa:checked   ~ #tab-mesa,
  #radio-eventos:checked ~ #tab-eventos,
  #radio-testim:checked  ~ #tab-testim,
  #radio-grupo:checked   ~ #tab-grupo { display: block; }
  #radio-acuerdos:checked ~ #tab-acuerdos { display: block; }
  #radio-inicio:checked ~ .barra-nav label[for="radio-inicio"],
  #radio-mesa:checked   ~ .barra-nav label[for="radio-mesa"],
  #radio-eventos:checked ~ .barra-nav label[for="radio-eventos"],
  #radio-testim:checked  ~ .barra-nav label[for="radio-testim"],
  #radio-grupo:checked   ~ .barra-nav label[for="radio-grupo"] { background: rgba(44,95,138,0.5); }
  #radio-acuerdos:checked ~ .barra-nav label[for="radio-acuerdos"] { background: rgba(44,95,138,0.5); }
  #radio-inicio:checked ~ .barra-nav label[for="radio-inicio"] .etiqueta,
  #radio-mesa:checked   ~ .barra-nav label[for="radio-mesa"] .etiqueta,
  #radio-eventos:checked ~ .barra-nav label[for="radio-eventos"] .etiqueta,
  #radio-testim:checked  ~ .barra-nav label[for="radio-testim"] .etiqueta,
  #radio-grupo:checked   ~ .barra-nav label[for="radio-grupo"] .etiqueta { color: #88c0e8; }
  #radio-acuerdos:checked ~ .barra-nav label[for="radio-acuerdos"] .etiqueta { color: #88c0e8; }
  #radio-inicio:checked ~ .barra-nav label[for="radio-inicio"] .icono,
  #radio-mesa:checked   ~ .barra-nav label[for="radio-mesa"] .icono,
  #radio-eventos:checked ~ .barra-nav label[for="radio-eventos"] .icono,
  #radio-testim:checked  ~ .barra-nav label[for="radio-testim"] .icono,
  #radio-grupo:checked   ~ .barra-nav label[for="radio-grupo"] .icono { opacity: 1; }
  #radio-acuerdos:checked ~ .barra-nav label[for="radio-acuerdos"] .icono { opacity: 1; }

  .barra-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1a2a3a;
    display: flex;
    height: 65px;
    box-shadow: 0 -3px 15px rgba(0,0,0,0.3);
    z-index: 9999;
  }
  .btn-nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: transparent;
    cursor: pointer;
    padding: 6px 2px;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
  }
  .btn-nav .icono {
    font-size: 18px;
    opacity: 0.85;
  }
  .btn-nav .etiqueta {
    font-family: 'Lato', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
  }
  .btn-nav.activo {
    background: rgba(44,95,138,0.5);
  }
  .btn-nav.activo::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 3px;
    background: #88c0e8;
    border-radius: 0 0 4px 4px;
  }
  .btn-nav.activo .icono { opacity: 1; }
  .btn-nav.activo .etiqueta { color: #88c0e8; }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    /* Stats block */
    #stats-block { padding: 12px 10px !important; }
    .mesa-card { padding: 14px 12px; }
    .mesa-name { font-size: 14px !important; }
    .mesa-role { font-size: 11px !important; }
    /* Acuerdos */
    .acuerdo-titulo { font-size: 16px; }
    .acuerdo-desc { font-size: 14px; }
    .acuerdo-tag { font-size: 12px; }
    .acuerdo-propone, .acuerdo-mesa { font-size: 13px; }
    /* Timeline */
    .timeline { padding-left: 20px; }
    .timeline-text { font-size: 17px; }
    .timeline-date { font-size: 12px; }
    /* Testimonios */
    .testimonio-card { padding: 10px 8px; }
    .testimonio-name { font-size: 14px; }
    .testimonio-date { font-size: 13px; }
    /* Autonomia */
    .autonomia-list li { font-size: 17px; }
    /* General */
    section { padding: 40px 14px; }
    h2 { font-size: clamp(22px, 6vw, 32px); }
    p { font-size: 17px; }
    /* Hero */
    .hero { padding: 28px 14px; }
    /* Footer */
    footer { padding: 36px 14px; }
  }

  /* ── TAB STRIPS ── */
  .tab-strip {
    height: 6px;
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .strip-resena    { background: #2c5f8a; }
  .strip-serv      { background: #1a6b4a; }
  .strip-eventos   { background: #8b4513; }
  .strip-testim    { background: #4a2c7a; }
  .strip-acuerdos  { background: #1a5a6b; }
  .strip-autonomia { background: #c9a96e; }

  /* ── CLASES UTILITARIAS (reemplaza estilos inline repetidos) ── */
  .acuerdo-header   { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .td-center        { padding:9px 6px; text-align:center; color:rgba(26,42,58,0.85); }
  .td-dia           { padding:9px 6px; font-weight:700; color:#1a2a3a; }
  .td-vacio         { padding:9px 6px; text-align:center; color:rgba(26,42,58,0.4); }
  .th-col           { padding:10px 6px; text-align:center; color:#2c5f8a; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:14px; }
  .th-dia           { padding:10px 6px; text-align:left;   color:#2c5f8a; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:14px; }
  .sublabel         { font-size:12px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:#2c5f8a; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid rgba(44,95,138,0.2); }
  .sep-top          { margin-top:14px; padding-top:12px; border-top:1px solid rgba(44,95,138,0.15); }
  .mb-24            { margin-bottom:24px; }

function b64ToBytes(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

  var ciphertext = b64ToBytes(PAYLOAD.ciphertext);

  var keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: PAYLOAD.iterations, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );

  var plainBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
  return new TextDecoder().decode(plainBuffer);
}

function activarFiltrosAcuerdos() {
  var filtros = document.querySelectorAll('.acuerdo-filtro-btn');
  var grid = document.getElementById('acuerdos-grid');
  if (!filtros.length || !grid) return;
  filtros.forEach(function(btn){
    btn.addEventListener('click', function(){
      filtros.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var f = btn.getAttribute('data-filtro');
      var cards = Array.prototype.slice.call(grid.querySelectorAll('.acuerdo-card'));
      var visibles = cards.filter(function(c){
        var estado = c.getAttribute('data-estado') || 'vigente';
        return f === 'todos' || estado === f;
      });
      var ocultas = cards.filter(function(c){
        var estado = c.getAttribute('data-estado') || 'vigente';
        return !(f === 'todos' || estado === f);
      });
      visibles.sort(function(a, b){
        var na = parseInt(a.querySelector('.acuerdo-num').textContent) || 0;
        var nb = parseInt(b.querySelector('.acuerdo-num').textContent) || 0;
        return (f === 'vencido' || f === 'proximo') ? na - nb : nb - na;
      });
      visibles.forEach(function(c){ c.style.display = ''; grid.appendChild(c); });
      ocultas.forEach(function(c){ c.style.display = 'none'; grid.appendChild(c); });
    });
  });
}

async function manejarIntento() {
  var pass = document.getElementById('input-clave').value;
  var errorMsg = document.getElementById('msg-error');
  try {
    var html = await intentarDescifrar(pass);
    document.getElementById('contenido-descifrado').innerHTML = html;
    document.getElementById('pantalla-clave').style.display = 'none';
    activarFiltrosAcuerdos();
  } catch (e) {
    errorMsg.style.display = 'block';
  }
}

document.getElementById('btn-entrar').addEventListener('click', manejarIntento);
document.getElementById('input-clave').addEventListener('keydown', function(e){
  if (e.key === 'Enter') manejarIntento();
});
</script>
